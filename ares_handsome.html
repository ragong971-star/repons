<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f5f7" />
<title>阿热斯帅不帅？</title>
<style>
  :root {
    --bg: #f5f5f7;
    --ink: #1d1d1f;
    --muted: #86868b;
    --blue: #0071e3;
    --card: rgba(255,255,255,.76);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 15% 12%, rgba(190,215,255,.55), transparent 34%),
      radial-gradient(ellipse at 85% 86%, rgba(225,210,255,.52), transparent 35%),
      var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
      "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .ambient {
    position: fixed; inset: 0; pointer-events: none; opacity: .45;
    background: linear-gradient(135deg, transparent 35%, rgba(255,255,255,.42), transparent 72%);
  }
  .card {
    position: relative;
    width: min(100%, 480px);
    padding: clamp(30px, 7vw, 52px) clamp(22px, 6vw, 42px) 34px;
    border: 1px solid rgba(255,255,255,.85);
    border-radius: 32px;
    background: var(--card);
    box-shadow: 0 24px 80px rgba(31, 43, 70, .10), inset 0 1px 0 rgba(255,255,255,.9);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    text-align: center;
    animation: cardIn .85s cubic-bezier(.2,.8,.2,1) both;
  }
  .badge {
    width: 68px; height: 68px; margin: 0 auto 24px; border-radius: 22px;
    display: grid; place-items: center; font-size: 31px;
    background: linear-gradient(145deg, #fff, #e9edf5);
    box-shadow: 0 8px 24px rgba(31,43,70,.09), inset 0 1px 0 #fff;
  }
  .eyebrow {
    margin: 0 0 12px; font-size: 12px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted); font-weight: 700;
  }
  h1 {
    margin: 0; font-size: clamp(31px, 8vw, 43px); letter-spacing: -.045em;
    line-height: 1.15; font-weight: 750;
  }
  .subtitle {
    margin: 16px 0 30px; color: #6e6e73; font-size: 15px; line-height: 1.6;
  }
  .choices {
    position: relative; display: flex; gap: 12px; justify-content: center;
    align-items: center; min-height: 58px; margin: 0 auto 16px;
  }
  button {
    border: 0; border-radius: 16px; min-width: 132px; min-height: 54px;
    padding: 0 24px; font: inherit; font-size: 16px; font-weight: 650;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease,
      background .25s ease, opacity .2s ease;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 3px solid rgba(0,113,227,.35); outline-offset: 4px; }
  .yes {
    color: white; background: var(--blue);
    box-shadow: 0 7px 16px rgba(0,113,227,.22);
  }
  .yes:hover { background: #0077ed; transform: translateY(-2px); box-shadow: 0 10px 22px rgba(0,113,227,.28); }
  .yes:active { transform: scale(.97); }
  .no {
    color: #1d1d1f; background: rgba(118,118,128,.12);
    border: 1px solid rgba(118,118,128,.08);
    position: relative;
  }
  .no:hover { background: rgba(118,118,128,.17); }
  .hint { min-height: 24px; margin: 12px 0 0; color: #86868b; font-size: 12px; }
  .toast {
    position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom));
    transform: translate(-50%, 18px); opacity: 0; pointer-events: none;
    max-width: calc(100vw - 32px); padding: 13px 18px; border-radius: 14px;
    color: white; background: rgba(29,29,31,.92); box-shadow: 0 10px 32px #0002;
    font-size: 14px; line-height: 1.45; white-space: nowrap;
    transition: opacity .28s ease, transform .35s cubic-bezier(.2,.8,.2,1);
    z-index: 10; backdrop-filter: blur(16px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .result {
    display: none; margin-top: 24px; padding: 20px 16px 8px;
    animation: rise .55s cubic-bezier(.2,.8,.2,1) both;
  }
  .result.show { display: block; }
  .result .emoji { font-size: 40px; display: block; margin-bottom: 10px; }
  .result strong { display: block; font-size: 23px; letter-spacing: -.03em; }
  .result p { color: #6e6e73; font-size: 14px; line-height: 1.6; margin: 9px 0 0; }
  .confetti {
    position: fixed; top: -14px; width: 8px; height: 12px; border-radius: 3px;
    pointer-events: none; z-index: 20; animation: fall 1.8s ease-in forwards;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fall { to { transform: translate(var(--drift), 105vh) rotate(650deg); opacity: .15; } }
  @media (max-width: 390px) {
    .choices { gap: 9px; }
    button { min-width: 0; flex: 1; padding: 0 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<main class="card">
  <div class="badge" aria-hidden="true">✨</div>
  <p class="eyebrow">THE MOST IMPORTANT QUESTION</p>
  <h1>阿热斯帅不帅？</h1>
  <p class="subtitle">请认真思考 0.5 秒，再做出你内心真正的选择。</p>
  <div class="choices" id="choices">
    <button class="yes" id="yesBtn">帅 😎</button>
    <button class="no" id="noBtn">不帅 🤨</button>
  </div>
  <p class="hint" id="hint">提示：答案其实已经很明显了。</p>
  <section class="result" id="result" aria-live="polite">
    <span class="emoji">🏆</span>
    <strong>眼光不错！认证成功。</strong>
    <p>经本页面权威认证：阿热斯，帅。<br>此结果不接受反驳。</p>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const choices = document.getElementById('choices');
  const toast = document.getElementById('toast');
  const hint = document.getElementById('hint');
  const result = document.getElementById('result');
  let toastTimer;
  let attempts = 0;
  let accepted = false;

  const errors = [
    '错误 403：拒绝访问此选项。',
    '系统提示：检测到不合理答案，请重试。',
    '选择失败。请检查你的审美设置。',
    '哎呀，按钮好像不太同意你的选择。',
    'Error 404：你要找的“不帅”不存在。',
    '系统正在保护你的判断力……'
  ];

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2100);
  }

  function dodge(event) {
    if (accepted) return;
    if (event) event.preventDefault();
    attempts++;
    const area = choices.getBoundingClientRect();
    const btn = noBtn.getBoundingClientRect();
    const pad = 8;
    const maxX = Math.max(0, window.innerWidth - btn.width - pad * 2);
    const maxY = Math.max(0, window.innerHeight - btn.height - pad * 2);
    const x = pad + Math.random() * maxX;
    const y = pad + Math.random() * maxY;

    noBtn.style.position = 'fixed';
    noBtn.style.left = `${x}px`;
    noBtn.style.top = `${y}px`;
    noBtn.style.zIndex = '5';
    noBtn.style.transform = `rotate(${Math.random() * 16 - 8}deg) scale(${0.94 + Math.random() * .12})`;
    showToast(errors[(attempts - 1) % errors.length]);
    hint.textContent = `你已经尝试否认 ${attempts} 次，但系统依然坚持原判。`;
  }

  // 鼠标靠近时就闪开；触屏用户点击时同样会触发。
  noBtn.addEventListener('pointerenter', dodge);
  noBtn.addEventListener('pointerdown', dodge);
  noBtn.addEventListener('click', dodge);
  noBtn.addEventListener('touchstart', dodge, {passive: false});

  function celebrate() {
    accepted = true;
    noBtn.style.display = 'none';
    yesBtn.style.display = 'none';
    choices.style.display = 'none';
    hint.textContent = '选择已提交，无法撤回。';
    result.classList.add('show');
    showToast('已确认：阿热斯很帅 ✓');
    const colors = ['#0071e3', '#8b5cf6', '#34c759', '#ff9f0a', '#ff375f'];
    for (let i = 0; i < 48; i++) {
      const bit = document.createElement('i');
      bit.className = 'confetti';
      bit.style.left = `${Math.random() * 100}vw`;
      bit.style.background = colors[Math.floor(Math.random() * colors.length)];
      bit.style.setProperty('--drift', `${Math.random() * 180 - 90}px`);
      bit.style.animationDelay = `${Math.random() * .45}s`;
      bit.style.animationDuration = `${1.3 + Math.random() * 1.2}s`;
      document.body.appendChild(bit);
      setTimeout(() => bit.remove(), 3000);
    }
  }
  yesBtn.addEventListener('click', celebrate);

  // 防止窗口尺寸变化后按钮跑到屏幕外。
  window.addEventListener('resize', () => {
    if (noBtn.style.position === 'fixed' && !accepted) {
      const r = noBtn.getBoundingClientRect();
      noBtn.style.left = `${Math.max(8, Math.min(r.left, innerWidth - r.width - 8))}px`;
      noBtn.style.top = `${Math.max(8, Math.min(r.top, innerHeight - r.height - 8))}px`;
    }
  });
})();
</script>
</body>
</html>
